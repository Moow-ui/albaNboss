<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#ab-grad)"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- Text 'A&B' -->
  <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">A</text>
  <text x="56" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="900" fill="#3b82f6">&amp;</text>
  <text x="80" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">B</text>
</svg>
