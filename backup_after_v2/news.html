<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>최신 뉴스 아카이브 | ALBA & BOSS 포털</title>
  <meta name="description" content="고용, 노동, 소상공인, 알바 관련 주요 언론 뉴스 전체 모음 및 실시간 검색">
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;

      --color-bg-body: #f8fafc;
      --color-bg-card: #ffffff;
      --color-border-subtle: #e2e8f0;

      --color-text-main: #0f172a;
      --color-text-sub: #475569;
      --color-text-muted: #94a3b8;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.08);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --max-width: 960px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
      color: var(--color-text-main);
      background-color: var(--color-bg-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px;
    }

    .text-logo {
      display: inline-flex;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-accent {
      color: var(--color-primary);
      margin: 0 2px;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-primary);
      background-color: var(--color-primary-light);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      transition: background-color var(--transition-fast);
    }

    .back-home-link:hover {
      background-color: #dbeafe;
    }

    .hero-section {
      padding: 48px 0 32px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--color-bg-body) 100%);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .hero-badge {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-primary);
      background-color: var(--color-primary-light);
      padding: 4px 14px;
      border-radius: var(--radius-full);
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 1.02rem;
      color: var(--color-text-sub);
      word-break: keep-all;
      max-width: 620px;
      margin: 0 auto 28px;
    }

    .search-box-wrap {
      max-width: 600px;
      margin: 0 auto 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 20px;
      font-size: 1rem;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-full);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      background-color: #ffffff;
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .tag-filter-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .filter-chip {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-sub);
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .filter-chip:hover {
      background-color: #f1f5f9;
      color: var(--color-text-main);
    }

    .filter-chip.active {
      background-color: var(--color-text-main);
      color: #ffffff;
      border-color: var(--color-text-main);
    }

    .content-section {
      padding: 40px 0 64px;
    }

    .list-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .count-info {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-sub);
    }

    .count-number {
      color: var(--color-primary);
    }

    .news-full-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-card {
      background-color: #ffffff;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .news-title-link {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.45;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color var(--transition-fast);
      word-break: keep-all;
      margin-bottom: 10px;
    }

    .news-title-link:hover {
      color: var(--color-primary);
      text-decoration: underline;
    }

    .news-summary {
      font-size: 0.95rem;
      color: var(--color-text-sub);
      line-height: 1.6;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .news-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
    }

    .news-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-sub);
    }

    .news-date {
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .news-tags {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-chip {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1e40af;
      background-color: #eff6ff;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      display: inline-block;
    }

    .empty-result {

      padding: 60px 20px;

      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border-subtle);
      color: var(--color-text-muted);
      font-size: 1rem;

    .site-footer {
      border-top: 1px solid var(--color-border-subtle);
      background-color: #ffffff;
      padding: 32px 0;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.9rem;

</head>
<body>

  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="text-logo">
        <span>ALBA</span><span class="logo-accent">&</span><span>BOSS</span>
      </a>
      <a href="index.html" class="back-home-link">
        <span>← 메인 포털 홈</span>
      </a>
    </div>
  </header>

  <section class="hero-section">
    <div class="container">
      <span class="hero-badge">고용·노동 시사 아카이브</span>
      <h1 class="hero-title">최신 뉴스 전체보기</h1>
      <p class="hero-desc">
        소상공인, 알바, 노동계의 주요 언론 기사와 최신 트렌드를 한곳에서 검색하세요.
      </p>

      <div class="search-box-wrap">
        <input 
          type="text" 
          id="news-search-input" 
          class="search-input" 
          placeholder="검색어 입력 (예: 골목상권, 근로계약서, 주휴수당, 채용)"
          autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>

      <div id="news-tag-chips" class="tag-filter-wrap">
        <button type="button" class="filter-chip active" data-tag="ALL">전체 보기</button>
      </div>
    </div>
  </section>

  <section class="content-section">
    <div class="container">
      <div class="list-header-row">
        <div class="count-info">
          등록된 뉴스 <span id="news-total-count" class="count-number">0</span>건
        </div>
        <div style="font-size: 0.85rem; color: var(--color-text-muted);">
          실시간 최신순 정렬
        </div>
      </div>

      <ul id="news-full-list" class="news-full-list">

      </ul>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 ALBA & BOSS Portal. 각 기사의 저작권은 해당 언론사에 있습니다.</p>
    </div>
  </footer>

  <script>
    let allNewsData = [];
    let currentFilteredData = [];
    let activeTag = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      loadNewsData();
      initSearchAndFilter();
    });

    function loadNewsData() {
      fetch('data/articles.json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.text();
        })
        .then(rawText => {
          const cleanText = rawText.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*/g, '');
          const data = JSON.parse(cleanText);
          if (Array.isArray(data) && data.length > 0) {
            initData(data);
          } else {
            useFallback();
          }
        })
        .catch(err => {
          console.warn('[news.html] articles.json fetch fallback:', err);
          useFallback();
        });
    }

    function useFallback() {
      initData(getFallbackArticles());
    }

    function initData(data) {
      allNewsData = data.slice().sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      currentFilteredData = allNewsData;
      buildTagChips(allNewsData);
      renderNewsList(currentFilteredData);
    }

    function buildTagChips(data) {
      const tagSet = new Set();
      data.forEach(item => {
        if (Array.isArray(item.tags)) {
          item.tags.forEach(t => tagSet.add(t.trim()));
        }
      });

      const container = document.getElementById('news-tag-chips');
      container.innerHTML = '<button type="button" class="filter-chip active" data-tag="ALL">전체 보기</button>';

      tagSet.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip';
        btn.dataset.tag = tag;
        btn.textContent = `#${tag}`;
        container.appendChild(btn);
      });

      container.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeTag = chip.dataset.tag;
          filterData();
        });
      });
    }

    function initSearchAndFilter() {
      const searchInput = document.getElementById('news-search-input');
      searchInput.addEventListener('input', filterData);
    }

    function filterData() {
      const keyword = (document.getElementById('news-search-input').value || '').trim().toLowerCase();

      currentFilteredData = allNewsData.filter(item => {
        const matchesTag = (activeTag === 'ALL') || (Array.isArray(item.tags) && item.tags.includes(activeTag));
        if (!matchesTag) return false;

        if (!keyword) return true;

        const title = (item.title || '').toLowerCase();
        const summary = (item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const tags = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';

        return title.includes(keyword) || summary.includes(keyword) || source.includes(keyword) || tags.includes(keyword);
      });

      renderNewsList(currentFilteredData);
    }

    function renderNewsList(items) {
      const container = document.getElementById('news-full-list');
      const countEl = document.getElementById('news-total-count');
      if (countEl) countEl.textContent = items.length;

      if (!items || items.length === 0) {
        container.innerHTML = '<li class="empty-result">검색 조건에 일치하는 뉴스가 없습니다.</li>';
        return;
      }

      container.innerHTML = items.map(item => {
        const safeTitle = escapeHtml(item.title || '');
        const safeSummary = escapeHtml(item.summary || '');
        const safeSource = escapeHtml(item.source || '언론사');
        const safeDate = escapeHtml(item.date || '');
        const safeUrl = item.url ? encodeURI(item.url) : '#';
        const tagsHtml = Array.isArray(item.tags)
          ? item.tags.map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('')
          : '';

        return `
          <li class="news-card">
            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="news-title-link" title="${safeTitle} 기사 원문 보기 (새 창)">
              ${safeTitle} ↗
            </a>
            <p class="news-summary">${safeSummary}</p>
            <div class="news-meta-row">
              <div class="news-source-badge">
                <span>📰 ${safeSource}</span>
                <span style="color:#cbd5e1;">·</span>
                <span class="news-date">${safeDate}</span>
              </div>
              <div class="news-tags">${tagsHtml}</div>
            </div>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
