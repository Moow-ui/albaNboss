    :root {

    *, *::before, *::after {

      margin: 0;
      padding: 0;
    }

    html {

      scroll-behavior: smooth;
    }

    body {

  <script>
    let allVideosData = [];
    let currentFilteredData = [];
    let activeTag = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      loadVideosData();
      initSearchAndFilter();
    });

    function loadVideosData() {
      fetch('data/videos.json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.text();
        })
        .then(rawText => {
          const cleanText = rawText.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*/g, '');
          const data = JSON.parse(cleanText);
          if (Array.isArray(data) && data.length > 0) {
            initData(data);
          } else {
            useFallback();
          }
        })
        .catch(err => {
          console.warn('[videos.html] videos.json fallback:', err);
          useFallback();
        });
    }

    function useFallback() {
      initData(getFallbackVideos());
    }

    function initData(data) {
      allVideosData = data;
      currentFilteredData = allVideosData;
      buildTagChips(allVideosData);
      renderVideoGrid(currentFilteredData);
    }

    function buildTagChips(data) {
      // 1. 태그 및 뱃지 빈도수 집계
      const tagCounts = {};
      data.forEach(item => {
        if (item.badge) {
          tagCounts[item.badge] = (tagCounts[item.badge] || 0) + 1;
        }
        if (Array.isArray(item.tags)) {
          item.tags.forEach(t => {
            const clean = t.trim();
            if (clean) tagCounts[clean] = (tagCounts[clean] || 0) + 1;
          });
        }
      });

      // 2. 많이 쓰인 순서로 정렬
      const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]);

      const container = document.getElementById('video-tag-chips');
      container.innerHTML = '<button type="button" class="filter-chip active" data-tag="ALL">전체 보기</button>';

      const INITIAL_COUNT = 8;
      const initialTags = sortedTags.slice(0, INITIAL_COUNT);
      const extraTags = sortedTags.slice(INITIAL_COUNT);

      initialTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip';
        btn.dataset.tag = tag;
        btn.textContent = `#${tag}`;
        container.appendChild(btn);
      });

      if (extraTags.length > 0) {
        const extraWrap = document.createElement('div');
        extraWrap.className = 'tag-extra-wrap is-hidden';

        extraTags.forEach(tag => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-chip';
          btn.dataset.tag = tag;
          btn.textContent = `#${tag}`;
          extraWrap.appendChild(btn);
        });
        container.appendChild(extraWrap);

        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'tag-toggle-btn';
        toggleBtn.innerHTML = `태그 더보기 (${extraTags.length}) ▾`;
        toggleBtn.setAttribute('aria-expanded', 'false');

        toggleBtn.addEventListener('click', () => {
          const isHidden = extraWrap.classList.contains('is-hidden');
          if (isHidden) {
            extraWrap.classList.remove('is-hidden');
            toggleBtn.innerHTML = '태그 접기 ▴';
            toggleBtn.setAttribute('aria-expanded', 'true');
          } else {
            extraWrap.classList.add('is-hidden');
            toggleBtn.innerHTML = `태그 더보기 (${extraTags.length}) ▾`;
            toggleBtn.setAttribute('aria-expanded', 'false');
          }
        });
        container.appendChild(toggleBtn);
      }

      container.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeTag = chip.dataset.tag;
          filterData();
        });
      });
    }

    function initSearchAndFilter() {
      const searchInput = document.getElementById('video-search-input');
      searchInput.addEventListener('input', filterData);
    }

    function filterData() {
      const keyword = (document.getElementById('video-search-input').value || '').trim().toLowerCase();

      currentFilteredData = allVideosData.filter(item => {
        const matchesTag = (activeTag === 'ALL') || (item.badge === activeTag) || (Array.isArray(item.tags) && item.tags.includes(activeTag));
        if (!matchesTag) return false;

        if (!keyword) return true;

        const title = (item.title || '').toLowerCase();
        const channel = (item.channel || '').toLowerCase();
        const summary = (item.summary || '').toLowerCase();
        const tags = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';

        return title.includes(keyword) || channel.includes(keyword) || summary.includes(keyword) || tags.includes(keyword);
      });

      renderVideoGrid(currentFilteredData);
    }

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function renderVideoGrid(items) {
      const container = document.getElementById('video-grid');
      const countEl = document.getElementById('video-total-count');
      if (countEl) countEl.textContent = items.length;

      if (!items || items.length === 0) {
        container.innerHTML = '<li class="empty-result">검색 조건에 일치하는 영상이 없습니다.</li>';
        return;
      }

      container.innerHTML = items.map(item => {
        const safeTitle = escapeHtml(item.title || '');
        const safeChannel = escapeHtml(item.channel || '공식 채널');
        const safeSummary = escapeHtml(item.summary || '');
        const duration = escapeHtml(item.duration || '00:00');
        const badge = escapeHtml(item.badge || '추천');
        const url = item.url ? encodeURI(item.url) : 'https://www.youtube.com';
        const videoId = getYouTubeId(item.url);
        const thumbImgHtml = videoId
          ? `<img src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg" alt="${safeTitle}" class="video-thumb-img" loading="lazy">`
          : '';
        const tagsHtml = Array.isArray(item.tags) && item.tags.length > 0
          ? `<span class="tag-chip">#${escapeHtml(item.tags[0])}</span>`
          : '';

        return `
          <li class="video-card">
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="video-thumb-wrap" title="${safeTitle} 재생 (새 창)">
              ${thumbImgHtml}
              <div class="video-thumb-overlay">
                <div class="play-btn-circle">▶</div>
              </div>
              <span class="video-badge">${badge}</span>
              <span class="video-duration">${duration}</span>
            </a>
            <div class="video-body">
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="video-title-link" title="${safeTitle}">
                ${safeTitle}
              </a>
              <div class="video-channel">
                <span>📺</span> ${safeChannel}
              </div>
              <p class="video-summary">${safeSummary}</p>
              <div class="video-footer">
                ${tagsHtml}
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="watch-link">
                  시청하기 ↗
                </a>
              </div>
            </div>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
