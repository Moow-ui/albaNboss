<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자유 커뮤니티 광장 | ALBA & BOSS 포털</title>
  <meta name="description" content="사장님과 알바생을 위한 소통, 매장 운영 노하우, 근무 경험담 자유게시판">
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;

      --color-heart: #ef4444;
      --color-heart-bg: #fef2f2;

      --color-bg-body: #f8fafc;
      --color-bg-card: #ffffff;
      --color-border-subtle: #e2e8f0;

      --color-text-main: #0f172a;
      --color-text-sub: #475569;
      --color-text-muted: #94a3b8;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --max-width: 960px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
      color: var(--color-text-main);
      background-color: var(--color-bg-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 상단 헤더 */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px;
    }

    .text-logo {
      display: inline-flex;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-accent {
      color: var(--color-primary);
      margin: 0 2px;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-primary);
      background-color: var(--color-primary-light);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      transition: background-color var(--transition-fast);
    }

    .back-home-link:hover {
      background-color: #dbeafe;
    }

    /* 히어로 섹션 */
    .hero-section {
      padding: 40px 0 24px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--color-bg-body) 100%);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .hero-badge {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #7c3aed;
      background-color: #f5f3ff;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 1.02rem;
      color: var(--color-text-sub);
      word-break: keep-all;
      max-width: 620px;
      margin: 0 auto 24px;
    }

    /* 게시판 탭 */
    .board-tabs-wrap {
      display: inline-flex;
      background-color: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-full);
      margin-bottom: 24px;
    }

    .board-tab-btn {
      border: none;
      background: none;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--color-text-sub);
      padding: 10px 24px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .board-tab-btn.active {
      background-color: #ffffff;
      color: var(--color-text-main);
      box-shadow: var(--shadow-sm);
    }

    /* 검색창 */
    .search-box-wrap {
      max-width: 600px;
      margin: 0 auto 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 20px;
      font-size: 1rem;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-full);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      background-color: #ffffff;
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    /* 12대 표준 태그 필터 칩 */
    .tag-filter-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 860px;
      margin: 0 auto;
    }

    .filter-chip {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--color-text-sub);
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 13px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .filter-chip:hover {
      background-color: #f1f5f9;
      color: var(--color-text-main);
    }

    .filter-chip.active {
      background-color: var(--color-text-main);
      color: #ffffff;
      border-color: var(--color-text-main);
    }

    /* 목록 구역 */
    .content-section {
      padding: 32px 0 64px;
    }

    .list-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .count-info {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-sub);
    }

    .count-number {
      color: var(--color-primary);
    }

    .write-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--color-primary);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: var(--radius-full);
      border: none;
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .write-btn:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    /* 게시글 카드 */
    .board-full-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .board-card {
      background-color: #ffffff;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .board-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .board-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.45;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .board-card:hover .board-card-title {
      color: var(--color-primary);
    }

    .board-card-snippet {
      font-size: 0.92rem;
      color: var(--color-text-sub);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    .board-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--color-text-muted);
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
    }

    .board-author-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .board-author {
      font-weight: 600;
      color: var(--color-text-sub);
    }

    .board-stats {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-chip {
      font-size: 0.76rem;
      font-weight: 600;
      color: #6366f1;
      background-color: #eef2ff;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      display: inline-block;
    }

    .empty-result {
      text-align: center;
      padding: 60px 20px;
      background-color: #ffffff;
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border-subtle);
      color: var(--color-text-muted);
      font-size: 1rem;
    }

    /* ==========================================================================
       모달 공통 스타일
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-box {
      background-color: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-lg);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 4px;
      transition: color var(--transition-fast);
    }

    .modal-close-btn:hover {
      color: var(--color-text-main);
    }

    /* --------------------------------------------------------------------------
       상세 보기 모달 (좋아요 버튼 + 댓글 영역)
       -------------------------------------------------------------------------- */
    .detail-tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 1.38rem;
      font-weight: 800;
      color: var(--color-text-main);
      line-height: 1.4;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .detail-content {
      font-size: 0.98rem;
      color: #334155;
      line-height: 1.7;
      word-break: keep-all;
      white-space: pre-line;
      padding: 16px 0 20px;
      border-top: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 20px;
    }

    /* 좋아요 & 통계 바 */
    .interaction-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .like-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: var(--color-text-sub);
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-full);
      padding: 8px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .like-action-btn:hover {
      background-color: var(--color-heart-bg);
      border-color: #fca5a5;
      color: var(--color-heart);
    }

    .like-action-btn.is-liked {
      background-color: var(--color-heart-bg);
      border-color: var(--color-heart);
      color: var(--color-heart);
    }

    .like-action-btn .heart-icon {
      font-size: 1.1rem;
      transition: transform var(--transition-fast);
    }

    .like-action-btn.is-liked .heart-icon {
      transform: scale(1.15);
    }

    .detail-stats-text {
      font-size: 0.88rem;
      color: var(--color-text-muted);
      font-weight: 600;
    }

    /* 댓글 섹션 */
    .comments-section {
      margin-top: 20px;
    }

    .comments-header-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comments-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .comment-item {
      background-color: #f8fafc;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      border: 1px solid #f1f5f9;
    }

    .comment-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.82rem;
    }

    .comment-author {
      font-weight: 700;
      color: var(--color-text-main);
    }

    .comment-date {
      color: var(--color-text-muted);
    }

    .comment-text {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.5;
      word-break: keep-all;
      white-space: pre-line;
    }

    .no-comments {
      text-align: center;
      padding: 24px;
      color: var(--color-text-muted);
      font-size: 0.9rem;
      background-color: #f8fafc;
      border-radius: var(--radius-sm);
    }

    /* 댓글 작성 폼 */
    .comment-write-box {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .comment-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .comment-author-input {
      width: 140px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      outline: none;
      background-color: #ffffff;
    }

    .comment-textarea {
      width: 100%;
      height: 64px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      outline: none;
      resize: vertical;
      font-family: inherit;
      background-color: #ffffff;
      margin-bottom: 8px;
    }

    .comment-textarea:focus, .comment-author-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .comment-btn-row {
      display: flex;
      justify-content: flex-end;
    }

    .comment-submit-btn {
      background-color: var(--color-primary);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 700;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .comment-submit-btn:hover {
      background-color: var(--color-primary-hover);
    }

    /* --------------------------------------------------------------------------
       새 글 작성 모달 (12대 태그 선택기 + 기타 직접입력)
       -------------------------------------------------------------------------- */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--color-text-main);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      background-color: #ffffff;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-textarea {
      height: 140px;
      resize: vertical;
    }

    /* 12대 태그 선택 그리드 */
    .tag-selector-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }

    .tag-select-chip {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-text-sub);
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .tag-select-chip:hover {
      background-color: #e2e8f0;
      color: var(--color-text-main);
    }

    .tag-select-chip.selected {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #ffffff;
    }

    .tag-custom-chip {
      background-color: #f5f3ff;
      border-color: #ddd6fe;
      color: #7c3aed;
    }

    .tag-custom-chip.selected {
      background-color: #7c3aed;
      border-color: #7c3aed;
      color: #ffffff;
    }

    #custom-tag-input-wrap {
      display: none;
      margin-top: 8px;
    }

    #custom-tag-input-wrap.is-visible {
      display: block;
    }

    .submit-post-btn {
      width: 100%;
      padding: 13px;
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .submit-post-btn:hover {
      background-color: var(--color-primary-hover);
    }

    /* 하단 푸터 */
    .site-footer {
      border-top: 1px solid var(--color-border-subtle);
      background-color: #ffffff;
      padding: 32px 0;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="text-logo">
        <span>ALBA</span><span class="logo-accent">&</span><span>BOSS</span>
      </a>
      <a href="index.html" class="back-home-link">
        <span>← 메인 포털 홈</span>
      </a>
    </div>
  </header>

  <!-- 히어로 & 탭 섹션 -->
  <section class="hero-section">
    <div class="container">
      <span class="hero-badge">소통 & 경험 나눔</span>
      <h1 class="hero-title">자유 커뮤니티 광장</h1>
      <p class="hero-desc">
        사장님의 매장 운영 고민부터 알바생의 생생한 근무 후기까지 자유롭게 나누세요.
      </p>

      <!-- 사장 / 알바 탭 -->
      <div class="board-tabs-wrap" role="tablist">
        <button type="button" id="tab-btn-boss" class="board-tab-btn active" data-type="boss">
          👔 사장 자유게시판
        </button>
        <button type="button" id="tab-btn-worker" class="board-tab-btn" data-type="worker">
          💼 알바 자유게시판
        </button>
      </div>

      <!-- 검색창 -->
      <div class="search-box-wrap">
        <input 
          type="text" 
          id="board-search-input" 
          class="search-input" 
          placeholder="검색어 입력 (예: 근무표, 시급, 근로계약서, 주휴수당)"
          autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>

      <!-- 12대 표준 태그 필터 칩 목록 -->
      <div id="board-tag-chips" class="tag-filter-wrap">
        <button type="button" class="filter-chip active" data-tag="ALL">전체 보기</button>
      </div>
    </div>
  </section>

  <!-- 게시글 목록 섹션 -->
  <section class="content-section">
    <div class="container">
      <div class="list-header-row">
        <div class="count-info">
          등록된 글 <span id="board-total-count" class="count-number">0</span>개
        </div>
        <button type="button" id="open-write-modal" class="write-btn">
          ✏️ 글쓰기
        </button>
      </div>

      <!-- 게시글 카드 목록 -->
      <ul id="board-full-list" class="board-full-list">
        <!-- JS로 동적 렌더링 -->
      </ul>
    </div>
  </section>

  <!-- ==========================================================================
       [모달 1] 상세 보기 모달 (좋아요 버튼 + 실제 댓글 구역)
       ========================================================================== -->
  <div id="view-modal" class="modal-backdrop">
    <div class="modal-box">
      <button type="button" class="modal-close-btn" id="close-view-modal">&times;</button>
      
      <div class="detail-tag-row">
        <div id="view-tags" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        <span id="view-author" style="font-weight:700; font-size:0.9rem; color:var(--color-text-sub);">작성자</span>
        <span style="color:#cbd5e1;">·</span>
        <span id="view-date" style="font-size:0.85rem; color:var(--color-text-muted);">날짜</span>
      </div>

      <h2 id="view-title" class="detail-title">제목</h2>
      <div id="view-content" class="detail-content">본문</div>

      <!-- 인터랙션 바: 실제 좋아요 버튼 + 통계 -->
      <div class="interaction-bar">
        <button type="button" id="view-like-btn" class="like-action-btn">
          <span class="heart-icon">🤍</span>
          <span>좋아요</span>
          <span id="view-likes-count" style="font-weight:800;">0</span>
        </button>

        <div class="detail-stats-text">
          <span>조회수 <strong id="view-views-count" style="color:var(--color-text-main);">0</strong>회</span>
          <span style="margin: 0 4px; color:#cbd5e1;">·</span>
          <span>댓글 <strong id="view-comments-count" style="color:var(--color-primary);">0</strong>개</span>
        </div>
      </div>

      <!-- 댓글 영역 -->
      <div class="comments-section">
        <h3 class="comments-header-title">
          <span>💬 댓글</span>
          <span id="view-comments-badge" style="font-size:0.88rem; color:var(--color-primary);">0</span>
        </h3>

        <!-- 댓글 목록 -->
        <ul id="view-comments-list" class="comments-list">
          <!-- JS 렌더링 -->
        </ul>

        <!-- 댓글 작성창 -->
        <div class="comment-write-box">
          <div class="comment-input-row">
            <input type="text" id="comment-author-input" class="comment-author-input" placeholder="닉네임 (기본: 익명)" maxlength="15">
          </div>
          <textarea id="comment-textarea" class="comment-textarea" placeholder="댓글을 작성해 주세요. 건전한 대화 문화를 함께 만듭니다." required></textarea>
          <div class="comment-btn-row">
            <button type="button" id="comment-submit-btn" class="comment-submit-btn">댓글 등록</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       [모달 2] 새 글 작성 모달 (12대 태그 선택기 + 직접 입력 옵션)
       ========================================================================== -->
  <div id="write-modal" class="modal-backdrop">
    <div class="modal-box">
      <button type="button" class="modal-close-btn" id="close-write-modal">&times;</button>
      <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:20px;">새 글 작성하기</h2>
      <form id="write-form">
        
        <div class="form-group">
          <label class="form-label">게시판 구분</label>
          <select id="form-type" class="form-input">
            <option value="boss">👔 사장 자유게시판</option>
            <option value="worker">💼 알바 자유게시판</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">닉네임</label>
          <input type="text" id="form-author" class="form-input" placeholder="예: 익명사장, 카페알바" required>
        </div>

        <div class="form-group">
          <label class="form-label">글 제목</label>
          <input type="text" id="form-title" class="form-input" placeholder="제목을 입력하세요" required>
        </div>

        <!-- 12대 표준 태그 선택 구역 -->
        <div class="form-group">
          <label class="form-label">태그 선택 (클릭하여 선택)</label>
          <div id="tag-selector-chips" class="tag-selector-grid">
            <!-- 12개 표준 태그 버튼이 JS로 생성됩니다 -->
          </div>
          <div id="custom-tag-input-wrap">
            <input type="text" id="form-custom-tag" class="form-input" placeholder="기타 태그 직접 입력 (예: 심야알바, 배달전문)">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea id="form-content" class="form-textarea" placeholder="내용을 작성해 주세요" required></textarea>
        </div>

        <button type="submit" class="submit-post-btn">게시글 등록하기</button>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
       [모달 3] 자유게시판 글쓰기 사전 안내 모달 (오픈 예정 안내)
       ========================================================================== -->
  <div id="notice-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 480px; text-align: center; padding: 36px 24px;">
      <button type="button" class="modal-close-btn" id="close-notice-modal">&times;</button>
      <div style="font-size: 2.8rem; margin-bottom: 16px;">📢</div>
      <h2 id="notice-modal-title" style="font-size: 1.3rem; font-weight: 800; margin-bottom: 14px; color: var(--color-text-main);">자유게시판 글쓰기 사전 안내</h2>
      <p id="notice-modal-msg" style="font-size: 0.98rem; line-height: 1.65; color: var(--color-text-sub); word-break: keep-all; margin-bottom: 24px;">
        자유게시판 글쓰기는 2027년 3월에 정식으로 열립니다.<br>지금은 운영자가 정리한 사례를 먼저 보여드려요.
      </p>
      <button type="button" id="confirm-notice-btn" class="submit-post-btn" style="width: auto; padding: 10px 32px; margin: 0 auto; display: inline-block;">확인</button>
    </div>
  </div>

  <!-- 하단 푸터 -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 ALBA & BOSS Portal. 건전하고 존중하는 커뮤니티 문화를 함께 만들어갑니다.</p>
    </div>
  </footer>

  <script>
    // ==========================================================================
    // 12대 대분류 표준 태그 목록
    // ==========================================================================
    const STANDARD_TAGS = [
      '근무표·스케줄',
      '시급·주휴수당',
      '근로계약서',
      '4대보험·세무',
      '퇴직금·정산',
      '알바채용·면접',
      '매장관리·오픈마감',
      '진상손님·대처',
      '정부지원금·소상공인',
      '배달·포스·키오스크',
      '업무인수인계',
      '자유토크·잡담'
    ];

    const STORAGE_KEY = 'alba_boss_board_posts_v2';

    let allBoardData = [];
    let currentType = 'boss'; // 'boss' | 'worker'
    let currentFilteredData = [];
    let activeTag = 'ALL';
    let currentViewingPost = null; // 현재 상세 모달에서 보고 있는 게시글 객체

    let boardConfig = {
      write_status: {
        is_open: false,
        open_target_date: "2027년 3월",
        notice_title: "자유게시판 글쓰기 사전 안내",
        notice_message: "자유게시판 글쓰기는 2027년 3월에 정식으로 열립니다. 지금은 운영자가 정리한 사례를 먼저 보여드려요."
      }
    };

    function loadBoardConfig() {
      fetch('data/board-config.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP error ' + res.status);
          return res.json();
        })
        .then(data => {
          if (data && data.write_status) {
            boardConfig = data;
          }
        })
        .catch(err => {
          console.warn('[board.html] board-config.json fallback:', err);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      parseUrlParams();
      loadBoardConfig();
      loadBoardData();
      initTabs();
      initSearchAndFilter();
      initWriteModalTagSelector();
      initModals();
    });

    function parseUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get('tab');
      if (tabParam === 'worker') {
        currentType = 'worker';
      } else {
        currentType = 'boss';
      }
      updateTabButtonUI();
    }

    function updateTabButtonUI() {
      document.querySelectorAll('.board-tab-btn').forEach(btn => {
        if (btn.dataset.type === currentType) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function initTabs() {
      document.querySelectorAll('.board-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentType = btn.dataset.type;
          updateTabButtonUI();
          activeTag = 'ALL';
          document.getElementById('board-search-input').value = '';
          updateFilterChipUI();
          filterData();
        });
      });
    }

    // ==========================================================================
    // 데이터 로드 및 localStorage 동기화
    // ==========================================================================
    function loadBoardData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          allBoardData = JSON.parse(stored).map(item => normalizePost(item));
          // 사장 자유 게시판 기존 예시글에 is_sample 표시 동기화
          allBoardData.forEach(item => {
            if (item.type === 'boss' && (item.is_sample || item.id <= 5)) {
              item.is_sample = true;
              item.badge = '예시 글';
            }
          });
          initBoardView();
          return;
        } catch (e) {
          console.warn('localStorage parse error:', e);
        }
      }

      // 저장된 데이터가 없으면 data/board.json에서 초기 로드
      fetch('data/board.json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.text();
        })
        .then(rawText => {
          const cleanText = rawText.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*/g, '');
          const data = JSON.parse(cleanText);
          if (Array.isArray(data) && data.length > 0) {
            allBoardData = data.map(item => normalizePost(item));
          } else {
            allBoardData = getFallbackBoard().map(item => normalizePost(item));
          }
          saveToStorage();
          initBoardView();
        })
        .catch(err => {
          console.warn('[board.html] board.json fallback:', err);
          allBoardData = getFallbackBoard().map(item => normalizePost(item));
          saveToStorage();
          initBoardView();
        });
    }

    function normalizePost(post) {
      return {
        id: post.id || Date.now() + Math.random(),
        type: post.type || 'boss',
        is_sample: !!post.is_sample,
        badge: post.badge || (post.is_sample ? '예시 글' : ''),
        title: post.title || '',
        content: post.content || '',
        author: post.author || '익명',
        date: post.date || new Date().toISOString().slice(0, 10),
        views: typeof post.views === 'number' ? post.views : 0,
        likes: typeof post.likes === 'number' ? post.likes : 0,
        liked: !!post.liked,
        comments: typeof post.comments === 'number' ? post.comments : 0,
        commentList: Array.isArray(post.commentList) ? post.commentList : [],
        tags: Array.isArray(post.tags) ? post.tags : []
      };
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allBoardData));
      } catch (e) {
        console.warn('localStorage save error:', e);
      }
    }

    function initBoardView() {
      buildTagChips();
      filterData();
    }

    // ==========================================================================
    // 상단 12대 표준 태그 필터 칩 생성
    // ==========================================================================
    function buildTagChips() {
      const container = document.getElementById('board-tag-chips');
      container.innerHTML = '<button type="button" class="filter-chip active" data-tag="ALL">전체 보기</button>';

      STANDARD_TAGS.forEach(tag => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip';
        btn.dataset.tag = tag;
        btn.textContent = `#${tag}`;
        container.appendChild(btn);
      });

      container.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeTag = chip.dataset.tag;
          filterData();
        });
      });
    }

    function updateFilterChipUI() {
      const chips = document.querySelectorAll('#board-tag-chips .filter-chip');
      chips.forEach(c => {
        if (c.dataset.tag === activeTag) c.classList.add('active');
        else c.classList.remove('active');
      });
    }

    function initSearchAndFilter() {
      const searchInput = document.getElementById('board-search-input');
      searchInput.addEventListener('input', filterData);
    }

    function filterData() {
      const keyword = (document.getElementById('board-search-input').value || '').trim().toLowerCase();

      currentFilteredData = allBoardData.filter(item => {
        if (item.type !== currentType) return false;

        const matchesTag = (activeTag === 'ALL') || (Array.isArray(item.tags) && item.tags.includes(activeTag));
        if (!matchesTag) return false;

        if (!keyword) return true;

        const title = (item.title || '').toLowerCase();
        const content = (item.content || '').toLowerCase();
        const author = (item.author || '').toLowerCase();
        const tags = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';

        return title.includes(keyword) || content.includes(keyword) || author.includes(keyword) || tags.includes(keyword);
      });

      // 최신순 정렬
      currentFilteredData.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
      renderBoardList(currentFilteredData);
    }

    // ==========================================================================
    // 게시글 카드 목록 렌더링
    // ==========================================================================
    function renderBoardList(items) {
      const container = document.getElementById('board-full-list');
      const countEl = document.getElementById('board-total-count');
      if (countEl) countEl.textContent = items.length;

      if (!items || items.length === 0) {
        container.innerHTML = '<li class="empty-result">등록된 게시글이 없거나 검색 결과가 없습니다.</li>';
        return;
      }

      container.innerHTML = items.map((item, idx) => {
        const safeTitle = escapeHtml(item.title || '');
        const safeContent = escapeHtml(item.content || '');
        const safeAuthor = escapeHtml(item.author || '익명');
        const safeDate = escapeHtml(item.date || '');
        const views = item.views || 0;
        const likes = item.likes || 0;
        const comments = (item.commentList ? item.commentList.length : item.comments) || 0;
        const tagsHtml = Array.isArray(item.tags)
          ? item.tags.map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('')
          : '';

        const statItems = [];
        if (views > 0) statItems.push(`<span class="stat-item">👁️ ${views}</span>`);
        if (likes > 0) statItems.push(`<span class="stat-item" style="${item.liked ? 'color:var(--color-heart);' : ''}">❤️ ${likes}</span>`);
        if (comments > 0) statItems.push(`<span class="stat-item">💬 ${comments}</span>`);
        const statsHtml = statItems.join('');

        return `
          <li class="board-card" data-index="${idx}">
            <h2 class="board-card-title">${item.is_sample ? '<span class="sample-tag-badge" style="display:inline-block; font-size:0.75rem; font-weight:700; color:#475569; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:2px 7px; margin-right:6px; vertical-align:middle;">예시 글</span>' : ''}${safeTitle}</h2>
            <p class="board-card-snippet">${safeContent}</p>
            <div class="board-meta-row">
              <div class="board-author-date">
                <span class="board-author">${safeAuthor}</span>
                <span style="color:#cbd5e1;">·</span>
                <span>${safeDate}</span>
                <span style="margin-left:6px;">${tagsHtml}</span>
              </div>
              <div class="board-stats">
                ${statsHtml}
              </div>
            </div>
          </li>
        `;
      }).join('');

      // 상세 조회 클릭 바인딩
      container.querySelectorAll('.board-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.dataset.index, 10);
          openDetailModal(currentFilteredData[idx]);
        });
      });
    }

    // ==========================================================================
    // [상세 보기 모달] 조회수 증가, 좋아요 토글, 댓글 작성 및 목록
    // ==========================================================================
    function openDetailModal(item) {
      if (!item) return;
      currentViewingPost = item;

      // 1) 실제 조회수 1 증가 (실제 기준)
      item.views = (item.views || 0) + 1;
      saveToStorage();

      // 모달 본문 채우기
      const sampleBadgeHtml = item.is_sample ? '<span class="sample-tag-badge" style="display:inline-block; font-size:0.8rem; font-weight:700; color:#475569; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:2px 8px; margin-right:6px; vertical-align:middle;">예시 글</span>' : '';
      document.getElementById('view-title').innerHTML = sampleBadgeHtml + escapeHtml(item.title || '');
      document.getElementById('view-content').textContent = item.content || '';
      document.getElementById('view-author').textContent = item.author || '익명';
      document.getElementById('view-date').textContent = item.date || '';

      // 태그 칩 표시
      const tagsContainer = document.getElementById('view-tags');
      if (Array.isArray(item.tags) && item.tags.length > 0) {
        tagsContainer.innerHTML = item.tags.map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
      } else {
        tagsContainer.innerHTML = `<span class="tag-chip">#자유토크·잡담</span>`;
      }

      // 통계 및 좋아요 UI 업데이트
      updateDetailModalStats();

      // 댓글 목록 렌더링
      renderCommentsList();

      // 댓글 입력창 초기화
      document.getElementById('comment-author-input').value = '';
      document.getElementById('comment-textarea').value = '';

      // 모달 표시
      document.getElementById('view-modal').classList.add('is-open');

      // 배경 목록 카드의 조회수/좋아요/댓글수도 즉시 갱신
      renderBoardList(currentFilteredData);
    }

    function updateDetailModalStats() {
      if (!currentViewingPost) return;

      const p = currentViewingPost;
      document.getElementById('view-views-count').textContent = p.views || 0;
      
      const commentsCount = (p.commentList ? p.commentList.length : p.comments) || 0;
      document.getElementById('view-comments-count').textContent = commentsCount;
      document.getElementById('view-comments-badge').textContent = commentsCount;

      // 좋아요 버튼 상태
      const likeBtn = document.getElementById('view-like-btn');
      const likeCountEl = document.getElementById('view-likes-count');
      likeCountEl.textContent = p.likes || 0;

      if (p.liked) {
        likeBtn.classList.add('is-liked');
        likeBtn.querySelector('.heart-icon').textContent = '❤️';
      } else {
        likeBtn.classList.remove('is-liked');
        likeBtn.querySelector('.heart-icon').textContent = '🤍';
      }
    }

    function renderCommentsList() {
      if (!currentViewingPost) return;
      const listEl = document.getElementById('view-comments-list');
      const comments = currentViewingPost.commentList || [];

      if (comments.length === 0) {
        listEl.innerHTML = '<li class="no-comments">작성된 댓글이 없습니다. 첫 번째 댓글을 남겨보세요! ✨</li>';
        return;
      }

      listEl.innerHTML = comments.map(c => `
        <li class="comment-item">
          <div class="comment-meta">
            <span class="comment-author">${escapeHtml(c.author || '익명')}</span>
            <span class="comment-date">${escapeHtml(c.date || '')}</span>
          </div>
          <p class="comment-text">${escapeHtml(c.content || '')}</p>
        </li>
      `).join('');
    }

    // ==========================================================================
    // [새 글 작성 모달] 12대 표준 태그 선택 칩 생성
    // ==========================================================================
    let selectedFormTags = new Set();
    let isCustomTagActive = false;

    function initWriteModalTagSelector() {
      const container = document.getElementById('tag-selector-chips');
      container.innerHTML = '';

      STANDARD_TAGS.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-select-chip';
        chip.textContent = `#${tag}`;
        chip.dataset.tag = tag;
        chip.addEventListener('click', () => {
          if (selectedFormTags.has(tag)) {
            selectedFormTags.delete(tag);
            chip.classList.remove('selected');
          } else {
            selectedFormTags.add(tag);
            chip.classList.add('selected');
          }
        });
        container.appendChild(chip);
      });

      // + 기타(직접입력) 칩
      const customChip = document.createElement('span');
      customChip.className = 'tag-select-chip tag-custom-chip';
      customChip.textContent = '✏️ 기타(직접입력)';
      customChip.id = 'chip-custom-tag-toggle';
      customChip.addEventListener('click', () => {
        isCustomTagActive = !isCustomTagActive;
        const inputWrap = document.getElementById('custom-tag-input-wrap');
        if (isCustomTagActive) {
          customChip.classList.add('selected');
          inputWrap.classList.add('is-visible');
          document.getElementById('form-custom-tag').focus();
        } else {
          customChip.classList.remove('selected');
          inputWrap.classList.remove('is-visible');
          document.getElementById('form-custom-tag').value = '';
        }
      });
      container.appendChild(customChip);
    }

    function resetWriteModalTagSelector() {
      selectedFormTags.clear();
      isCustomTagActive = false;
      document.querySelectorAll('#tag-selector-chips .tag-select-chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('custom-tag-input-wrap').classList.remove('is-visible');
      document.getElementById('form-custom-tag').value = '';
    }

    // ==========================================================================
    // 모달 및 인터랙션 이벤트 바인딩
    // ==========================================================================
    function initModals() {
      // 1. 상세 모달 닫기
      const viewModal = document.getElementById('view-modal');
      document.getElementById('close-view-modal').addEventListener('click', () => {
        viewModal.classList.remove('is-open');
        currentViewingPost = null;
        renderBoardList(currentFilteredData);
      });

      // 2. 좋아요 버튼 클릭 이벤트 (실제 기준 카운팅)
      const likeBtn = document.getElementById('view-like-btn');
      likeBtn.addEventListener('click', () => {
        if (!currentViewingPost) return;

        currentViewingPost.liked = !currentViewingPost.liked;
        if (currentViewingPost.liked) {
          currentViewingPost.likes = (currentViewingPost.likes || 0) + 1;
        } else {
          currentViewingPost.likes = Math.max(0, (currentViewingPost.likes || 1) - 1);
        }

        saveToStorage();
        updateDetailModalStats();
        renderBoardList(currentFilteredData);
      });

      // 3. 댓글 등록 버튼 클릭 이벤트 (실제 기준 카운팅)
      const commentSubmitBtn = document.getElementById('comment-submit-btn');
      commentSubmitBtn.addEventListener('click', () => {
        if (!currentViewingPost) return;

        const contentInput = document.getElementById('comment-textarea');
        const content = contentInput.value.trim();
        if (!content) {
          alert('댓글 내용을 입력해 주세요.');
          contentInput.focus();
          return;
        }

        const authorInput = document.getElementById('comment-author-input');
        const author = authorInput.value.trim() || '익명';

        const now = new Date();
        const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        if (!currentViewingPost.commentList) {
          currentViewingPost.commentList = [];
        }

        currentViewingPost.commentList.push({
          author: author,
          content: content,
          date: dateStr
        });

        currentViewingPost.comments = currentViewingPost.commentList.length;

        saveToStorage();
        renderCommentsList();
        updateDetailModalStats();
        renderBoardList(currentFilteredData);

        // 입력창 비우기
        contentInput.value = '';
      });

      // 4. 새 글 작성 모달 열기/닫기 또는 오픈 예정 안내
      const writeModal = document.getElementById('write-modal');
      const noticeModal = document.getElementById('notice-modal');

      const closeNoticeModal = () => {
        if (noticeModal) noticeModal.classList.remove('is-open');
      };
      if (document.getElementById('close-notice-modal')) {
        document.getElementById('close-notice-modal').addEventListener('click', closeNoticeModal);
      }
      if (document.getElementById('confirm-notice-btn')) {
        document.getElementById('confirm-notice-btn').addEventListener('click', closeNoticeModal);
      }
      if (noticeModal) {
        noticeModal.addEventListener('click', (e) => {
          if (e.target === noticeModal) closeNoticeModal();
        });
      }

      document.getElementById('open-write-modal').addEventListener('click', () => {
        if (!boardConfig.write_status || !boardConfig.write_status.is_open) {
          const ws = (boardConfig && boardConfig.write_status) || {};
          const titleEl = document.getElementById('notice-modal-title');
          const msgEl = document.getElementById('notice-modal-msg');
          if (titleEl && ws.notice_title) titleEl.textContent = ws.notice_title;
          if (msgEl && ws.notice_message) {
            msgEl.innerHTML = escapeHtml(ws.notice_message).replace(/\n/g, '<br>');
          }
          if (noticeModal) noticeModal.classList.add('is-open');
          return;
        }

        document.getElementById('form-type').value = currentType;
        resetWriteModalTagSelector();
        writeModal.classList.add('is-open');
      });
      document.getElementById('close-write-modal').addEventListener('click', () => {
        writeModal.classList.remove('is-open');
      });

      // 5. 새 글 등록 폼 제출
      document.getElementById('write-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.getElementById('form-type').value;
        const author = document.getElementById('form-author').value.trim();
        const title = document.getElementById('form-title').value.trim();
        const content = document.getElementById('form-content').value.trim();

        // 선택된 태그 목록 취합
        const finalTags = Array.from(selectedFormTags);
        const customTagVal = document.getElementById('form-custom-tag').value.trim();
        if (customTagVal) {
          // 쉼표나 띄어쓰기로 분리 가능
          customTagVal.split(/[,#\s]+/).filter(Boolean).forEach(t => {
            if (!finalTags.includes(t)) finalTags.push(t);
          });
        }
        if (finalTags.length === 0) {
          finalTags.push('자유토크·잡담');
        }

        const today = new Date().toISOString().slice(0, 10);

        // 실제 기준으로 모든 카운트 0으로 시작
        const newPost = {
          id: Date.now(),
          type: type,
          title: title,
          content: content,
          author: author,
          date: today,
          views: 0,
          likes: 0,
          liked: false,
          comments: 0,
          commentList: [],
          tags: finalTags
        };

        allBoardData.unshift(newPost);
        saveToStorage();

        writeModal.classList.remove('is-open');
        document.getElementById('write-form').reset();
        resetWriteModalTagSelector();

        currentType = type;
        updateTabButtonUI();
        filterData();
      });
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
